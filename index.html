<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1424"><title>SmartStockAI v1.7</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header><div><h1>SmartStockAI <small>v1.7</small></h1><p>台股策略 × 50 檔驗證 × 成本回測</p></div><b class="badge">TWSE</b></header><main>
<section class="summary"><div class="card wide">模擬總資產<b id="asset">NT$100,000</b></div><div class="card">可用現金<b id="cash">NT$100,000</b></div><div class="card">累計損益<b id="pnl">NT$0</b></div></section>
<nav><button class="on" data-t="picks">策略精選</button><button data-t="validate">策略驗證</button><button data-t="hold">持股</button><button data-t="trades">紀錄</button><button data-t="perf">績效</button></nav>
<section id="picks" class="panel on"><h2>策略精選 <small>50 → 5</small></h2><div class="notice">沿用 v1.6 選股邏輯。可重新掃描 50 檔，或直接使用上次結果。</div><button id="scanBtn" class="primary">開始／重新掃描 50 檔</button><div class="progress"><div id="scanBar"></div></div><div id="scanStatus" class="status">尚未開始</div><div id="list"></div></section>
<section id="validate" class="panel"><h2>策略驗證 <small>v1.7</small></h2><div class="notice">這次不是只回測今天選出的 5 檔，而是依序驗證 50 檔候選池。預設抓約 12 個月日行情，並扣除簡化交易成本。手機查詢較多，請保持此頁開啟。</div>
<div class="controls"><label>分數門檻<select id="threshold"><option>60</option><option selected>65</option><option>70</option><option>75</option></select></label><label>持有天數<select id="days"><option>3</option><option selected>5</option><option>10</option><option>20</option></select></label></div>
<button id="valBtn" class="primary">開始驗證 50 檔</button><div class="progress"><div id="valBar"></div></div><div id="valStatus" class="status">尚未開始</div><div id="valSummary"></div><div id="valList"></div></section>
<section id="hold" class="panel"><h2>模擬持股</h2><div id="holds"></div></section><section id="trades" class="panel"><h2>交易紀錄</h2><div id="tradeList"></div></section><section id="perf" class="panel"><h2>模擬帳戶績效</h2><div class="summary"><div class="card">已實現損益<b id="realized"></b></div><div class="card">未實現損益<b id="unrealized"></b></div><div class="card wide">總報酬率<b id="rate"></b></div></div></section>
</main><script src="app.js?v=17"></script></body></html>
