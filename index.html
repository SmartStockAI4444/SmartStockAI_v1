<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1424"><title>SmartStockAI v1.8</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header><div><h1>SmartStockAI <small>v1.8</small></h1><p>台股策略 × 樣本外驗證</p></div><b class="badge">TWSE</b></header><main>
<section class="summary"><div class="card wide">模擬總資產<b id="asset">NT$100,000</b></div><div class="card">可用現金<b id="cash">NT$100,000</b></div><div class="card">累計損益<b id="pnl">NT$0</b></div></section>
<nav><button class="on" data-t="picks">策略精選</button><button data-t="oos">樣本外驗證</button><button data-t="hold">持股</button><button data-t="trades">紀錄</button></nav>
<section id="picks" class="panel on"><h2>策略精選 <small>沿用 v1.7</small></h2><div class="notice">保留上一次 50 檔掃描結果。v1.8 的重點是驗證固定規則在較新的「未參與調整」資料區段是否仍有相似表現。</div><div id="list"></div></section>
<section id="oos" class="panel"><h2>樣本外驗證 <small>v1.8</small></h2><div class="notice">固定規則：Strategy 分數門檻 65、持有 20 個交易日。抓取約 18 個月資料，依時間切成前 70%「開發樣本」與後 30%「樣本外」。兩段都使用完全相同規則，不再調參。</div><button id="oosBtn" class="primary">開始 50 檔樣本外驗證</button><div class="progress"><div id="bar"></div></div><div id="status" class="status">尚未開始</div><div id="summary"></div><div id="details"></div></section>
<section id="hold" class="panel"><h2>模擬持股</h2><div id="holds"></div></section><section id="trades" class="panel"><h2>交易紀錄</h2><div id="tradeList"></div></section>
</main><script src="app.js?v=18"></script></body></html>
