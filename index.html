<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1424"><title>SmartStockAI v1.6</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header><div><h1>SmartStockAI <small>v1.6</small></h1><p>台股行情 × 自動篩選 × 歷史回測</p></div><b class="demo" id="dataBadge">TWSE</b></header><main><section class="summary"><div class="card wide">模擬總資產<b id="asset">NT$100,000</b></div><div class="card">可用現金<b id="cash">NT$100,000</b></div><div class="card">累計損益<b id="pnl">NT$0</b></div></section><nav><button class="on" data-t="picks">策略精選</button><button data-t="backtest">回測</button><button data-t="hold">持股</button><button data-t="trades">紀錄</button><button data-t="perf">績效</button></nav><section id="picks" class="panel on"><h2>策略精選 <small>50 → 5</small></h2><div class="notice">Strategy v1.6 延續 50 檔候選池。掃描結果會保存在手機。</div><button id="scanBtn" class="primary">開始／重新掃描 50 檔</button><div class="progress"><div id="bar"></div></div><div id="scanStatus" class="status">尚未開始</div><div id="list"></div></section><section id="backtest" class="panel"><h2>歷史回測 <small>Strategy v1.6</small></h2><div class="notice">簡易回測規則：每個歷史交易日用當時以前的資料計算分數；分數 ≥ 65 時模擬持有 5 個交易日。結果只用來檢查策略歷史特性，不代表未來績效。</div><button id="btBtn" class="primary">回測目前精選 5 檔</button><div id="btStatus" class="status">請先完成選股掃描，再執行回測。</div><div id="btSummary"></div><div id="btList"></div></section><section id="hold" class="panel"><h2>模擬持股</h2><div id="holds"></div></section><section id="trades" class="panel"><h2>交易紀錄</h2><div id="tradeList"></div></section><section id="perf" class="panel"><h2>模擬帳戶績效</h2><div class="summary"><div class="card">已實現損益<b id="realized"></b></div><div class="card">未實現損益<b id="unrealized"></b></div><div class="card wide">總報酬率<b id="rate"></b></div></div></section></main><script src="app.js?v=16"></script></body></html>
